<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="fairshift">
  <defs>
    <linearGradient id="fs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5A4"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#fs-bg)"/>
  <!-- Equal-length shifts, staggered starts: same hours, fairly shifted -->
  <rect x="18" y="27" width="56" height="14" rx="7" fill="#FFFFFF"/>
  <rect x="30" y="47" width="56" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.92"/>
  <rect x="42" y="67" width="56" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.84"/>
  <rect x="54" y="87" width="56" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.76"/>
  <!-- Coverage line: every shift crosses it, nobody is left alone -->
  <line x1="64" y1="18" x2="64" y2="110" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
</svg>
